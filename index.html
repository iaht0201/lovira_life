<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Lovira Life — Trợ lý Đời sống thông minh</title>
    <meta name="description" content="Trợ lý Đời sống thông minh dành cho người khuyết tật, người cao tuổi và người cần hỗ trợ trong các hoạt động đời sống" />
    <meta name="theme-color" content="#287C78" />

    <!-- Apple PWA & Mobile Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lovira Life" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="icon" type="image/png" href="/brand/logo-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/logo-icon.png" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body class="bg-bg-base text-text-primary antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Capture PWA beforeinstallprompt globally as early as possible
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPWAInstallPrompt = e;
      });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js')
            .then((reg) => {
              console.log('[PWA] Service Worker registered successfully:', reg.scope);
            })
            .catch((err) => {
              console.warn('[PWA] Service Worker registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
